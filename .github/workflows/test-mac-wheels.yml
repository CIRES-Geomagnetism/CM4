name: Build CM4 wheels in macOS

on:
  push:
    branches: [vendor_gfortran_into_wheel]

jobs:
  build-mac-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "macos-latest" ]
        python-version: [ "cp313"]
        include:
          - os: "macos-latest"
            arch: "arm64"
          #- os: "macos-15-intel"
          #  arch: "x86_64"

    steps:
      - uses: actions/checkout@v3

      - name: Install Fortran compiler
        run: |
            brew update
            brew install gcc
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
            echo "FC=$(brew --prefix)/bin/gfortran" >> "$GITHUB_ENV"
            gfortran --version

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
            CIBW_BUILD: "${{ matrix.python-version }}-*"
            CIBW_ARCHS_MACOS: "${{ matrix.arch }}"
            CIBW_TEST_COMMAND: "python -c \"import cm4; print(cm4.__version__)\""

      - name: Test the built wheel
        run: |
          pip install dist/*.whl
          python -c "import cm4; print(cm4.__version__)"

