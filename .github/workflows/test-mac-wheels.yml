name: Build CM4 wheels in macOS

on:
  push:
    branches: [vendor_gfortran_into_wheel]

jobs:
  build-mac-wheels:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ "macos-latest", "macos-15-intel" ]
        python-version: [ "3.13"]
        include:
          - os: "macos-latest"
            arch: "arm64"
          - os: "macos-15-intel"
            arch: "x86_64"

    steps:
      - uses: actions/checkout@v3

      - name: Install gcc
        run: |
            brew update
            brew install gcc
            echo "DYLD_LIBRARY_PATH=/opt/homebrew/lib:/usr/local/lib:${DYLD_LIBRARY_PATH}" >> $GITHUB_ENV
            ls -l /usr/local/opt/gcc/lib/gcc/current/ || true
            

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
            CIBW_BUILD: "${{ matrix.python-version }}-*"
            CIBW_ARCHS_MACOS: "${{ matrix.arch }}"
            # Set the OS floor (11.0 is a safe modern bet for universal2)
            MACOSX_DEPLOYMENT_TARGET: "11.0"
            CIBW_BEFORE_TEST: "brew uninstall gcc || true"
            #CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            #  DYLD_LIBRARY_PATH="/opt/homebrew/lib:/usr/local/lib:${DYLD_LIBRARY_PATH}"
            #  delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
            CIBW_TEST_COMMAND: "python -c \"import cm4; print(cm4.__version__)\""

      - name: Test the built wheel
        run: |
          pip install dist/*.whl
          python -c "import cm4; print(cm4.__version__)"

