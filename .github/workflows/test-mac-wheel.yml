name: Test Mac Wheel for CM4

on:
  push:
    branches: ["python314"]

jobs:
  build-mac-wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["macos-26-intel"]
        python-version: [ "3.14"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gfortran
        uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: gcc
          version: "15"

      - name: Build and install cm4
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m build --wheel 

      - name: Test the wheel
        run: |
          pip install dist/*.whl
          python -c "import cm4; print(cm4.__version__)"
          python tests/fortran_python_parity_test.py

      - name: Upload cleaned wheels
        uses: actions/upload-artifact@v4
        with:
          name: mac-wheels
          path: dist/*.whl


