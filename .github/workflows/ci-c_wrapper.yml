name: c_wrapper ci/cd

on:
  push:
    branches: ["c_wrapper"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: [ '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}

    - name: Build and install cm4field
      run: |
        python -m pip install --upgrade pip
        python -m build --wheel 
        pip install dist/*.whl

    - name: Run smoke test
      run: |
            python example.py
        
        
    
