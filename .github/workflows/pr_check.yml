name: Pull Request Check

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"

jobs:
  build-windows-wheel:
    if: github.event.pull_request.draft == false  # ❗ Skip if draft == true
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: "x64"

      - name: Install MSYS2 + gfortran
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc-fortran

      - name: Add MSYS2 to PATH
        run: |
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Install cibuildwheel and dependencies
        shell: bash
        run: |
          python -m pip install cibuildwheel>=3.4.0 delvewheel # Upgrade to >=3.1.0 after Python3.14 final release 
      
     - name: Build wheels
        shell: bash
        run: cibuildwheel --platform windows --output-dir wheelhouse
        env:
          CIBW_ARCHS: "AMD64"
          FC: gfortran
          CC: gcc
          CXX: g++
          CIBW_BUILD: "cp314-*"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:\\\\msys64\\\\mingw64\\\\bin -w {dest_dir} {wheel}"        
        

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheels
          path: wheelhouse/*.whl

  test_artifacts:
    name: Test Artifacts
    runs-on: windows-latest
    needs: build-windows-wheel
    strategy:
      fail-fast: true  # Stop the jobs if it fails at one of Python versions
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14"]
    env:
      version: "1.0.4"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: "x64"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-wheels
          path: wheelhouse

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install the wheel
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          if (${{ matrix.python-version }} -eq "3.14") {
            pip install wheelhouse\cm4-${env:version}-cp314-cp314-win_amd64.whl
          } elseif (${{ matrix.python-version }} -eq "3.13") {
            pip install wheelhouse\cm4-${env:version}-cp313-cp313-win_amd64.whl
          } elseif (${{ matrix.python-version }} -eq "3.12") {
            pip install wheelhouse\cm4-${env:version}-cp312-cp312-win_amd64.whl
          } elseif (${{ matrix.python-version }} -eq "3.11") {
            pip install wheelhouse\cm4-${env:version}-cp311-cp311-win_amd64.whl
          }
      - name: Run fortran python parity test
        shell: pwsh
        run: |
          cd $env:GITHUB_WORKSPACE
          .\venv\Scripts\Activate.ps1
          python tests/fortran_python_parity_test.py
  
