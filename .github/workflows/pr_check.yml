name: Pull Request Check

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"

jobs:
  build-linux-wheels:
    if: github.event.pull_request.draft == false  # ❗ Skip if draft == true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "cp311", "cp312", "cp313", "cp314" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_ARCHS: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

          # Skip to build musllinux and 32-bit manylinux wheels
          CIBW_SKIP: "*-musllinux* *-manylinux_i686"
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_TEST_COMMAND: "python -c \"import cm4; print(cm4.__version__)\" && python {project}/tests/fortran_python_parity_test.py"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-latest-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          retention-days: 1

  build-mac-wheels:
    if: github.event.pull_request.draft == false  # ❗ Skip if draft == true
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "macos-15", "macos-15-intel" ]
        python-version: [ "cp311", "cp312", "cp313", "cp314" ]
        include:
          - os: "macos-15"
            arch: "arm64"
          - os: "macos-15-intel"
            arch: "x86_64"

    steps:
      - uses: actions/checkout@v3

      - name: Install Fortran compiler
        run: |
          brew update
          brew install gcc
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "FC=$(brew --prefix)/bin/gfortran" >> "$GITHUB_ENV"
          gfortran --version

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_ARCHS_MACOS: "${{ matrix.arch }}"
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          CIBW_BEFORE_BUILD_MACOS: "python -m pip install delocate"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
          CIBW_TEST_COMMAND: "python -c \"import cm4; print(cm4.__version__)\" && python {project}/tests/fortran_python_parity_test.py"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          retention-days: 1

  build-windows-wheels:
    if: github.event.pull_request.draft == false  # ❗ Skip if draft == true
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [ "cp311", "cp312", "cp313", "cp314" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Install MSYS2 + gfortran
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc-fortran

      - name: Add MSYS2 to PATH
        run: |
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_ARCHS: "AMD64"
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_ENVIRONMENT_WINDOWS: "FC=gfortran CC=gcc CXX=g++"
          CIBW_TEST_COMMAND: "python -c \"import cm4; print(cm4.__version__)\" && python {project}/tests/fortran_python_parity_test.py"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "uvx delvewheel repair --add-path C:\\msys64\\mingw64\\bin -w {dest_dir} {wheel}"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-latest-${{ matrix.python-version }}
          path: wheelhouse/*.whl
          retention-days: 1

  test-wheels:
    # Test the built wheels vendor gfortran dylib into the wheel
    needs: [ build-linux-wheels, build-windows-wheels, build-mac-wheels ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "ubuntu-latest", "windows-latest", "macos-15", "macos-15-intel" ]
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Download built wheels
          uses: actions/download-artifact@v5
          with:
            name: wheels-${{ matrix.os }}-cp313
            path: dist
            merge-multiple: true

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.13"

        - name: Install wheel
          run: |
            python -m pip install --upgrade pip
            python -m pip install dist/*.whl

        - name: Run smoke test
          run: |
            python -c "import cm4; print(cm4.__version__)"
            python tests/fortran_python_parity_test.py
  dry-run-release:
    needs: test-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download built wheels
        uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List Wheels
        run: ls -R dist

      - name: Upload wheels to Github Release
        uses: softprops/action-gh-release@v1

        with:
          draft: true
          files: dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    


