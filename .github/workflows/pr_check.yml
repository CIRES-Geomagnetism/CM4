name: Pull Request Check

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"

jobs:
  build-test-windows-wheel:
    if: github.event.pull_request.draft == false  # ❗ Skip if draft == true
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            cp-tag: "311"
          - python-version: "3.12"
            cp-tag: "312"
          - python-version: "3.13"
            cp-tag: "313"
          - python-version: "3.14"
            cp-tag: "314"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: "x64"

      - name: Install MSYS2 + gfortran
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc-fortran

      - name: Add MSYS2 to PATH
        run: |
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Install cibuildwheel and dependencies
        shell: bash
        run: |
          python -m pip install cibuildwheel>=3.4.0 delvewheel # Upgrade to >=3.1.0 after Python3.14 final release 

      - name: Build wheels
        shell: bash
        run: cibuildwheel --platform windows --output-dir wheelhouse
        env:
          CIBW_ARCHS: "AMD64"
          FC: gfortran
          CC: gcc
          CXX: g++
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_TEST_REQUIRES: "numpy"
          CIBW_TEST_COMMAND: "python -c \"import cm4; print(cm4.__version__)"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:\\\\msys64\\\\mingw64\\\\bin -w {dest_dir} {wheel}"


      - name: Create virtual environment
        run: python -m venv venv

      - name: Install the wheel
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install wheelhouse\*.whl

      - name: Run fortran python parity test
        shell: pwsh
        run: |
          cd $env:GITHUB_WORKSPACE
          .\venv\Scripts\Activate.ps1
          python tests/fortran_python_parity_test.py
  
