[project]
name = "cm4"
version = "1.0.0"
description = "Python wrapper of CM4"
authors = [{name = "Collin Kadlecek", email = "collin.kadlecek@colorado.edu"}, {name = "Li-Yin Young", email = "liyin.young@colorado.edu"}]
maintainers = [{name = "Collin Kadlecek", email = "collin.kadlecek@colorado.edu"}]
requires-python = ">=3.9"
dependencies = ["numpy", "geomaglib>=1.2.1"]


readme = "readme.md"


[build-system]
requires = ["meson-python", "ninja", "numpy"]
build-backend = "mesonpy"

[project.urls]
Homepage = "https://github.com/CIRES-Geomagnetism/CM4.git"
Repositories = "https://github.com/CIRES-Geomagnetism/CM4.git"
