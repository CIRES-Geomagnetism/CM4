[project]
name = "cm4"
version = "1.0.9"
description = "Python wrapper of CM4"
authors = [{name = "Collin Kadlecek", email = "collin.kadlecek@colorado.edu"}, {name = "Li-Yin Young", email = "liyin.young@colorado.edu"}, {name = "Liam Kilcommons", email = "liam.kilcommons@colorado.edu"}]
maintainers = [{name = "Collin Kadlecek", email = "collin.kadlecek@colorado.edu"}]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = ["numpy", "geomaglib>=1.2.1"]
readme = "readme.md"

[build-system]
requires = ["meson-python", "ninja", "numpy"]
build-backend = "mesonpy"

[project.urls]
Homepage = "https://github.com/CIRES-Geomagnetism/CM4.git"
Repositories = "https://github.com/CIRES-Geomagnetism/CM4.git"


